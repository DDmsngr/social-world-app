name: channel-feeder

# Наполняет системные каналы ChaWo (@chawo_*) постами из публичных
# Telegram-каналов. Как часто постить в каждый канал, решает сам скрипт
# (everyMin в tools/channel-feeder/feed.mjs), здесь — только частота проверки.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: channel-feeder
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/channel-feeder

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests
        run: node --test tools/channel-feeder/feed.test.mjs

      - name: Feed channels
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tools/channel-feeder/feed.mjs
