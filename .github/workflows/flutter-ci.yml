name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Опубликовать release APK в GitHub Release"
        required: true
        type: boolean
        default: true
      release_tag:
        description: "Тег релиза; пусто = android-release-<номер запуска>"
        required: false
        type: string
        default: ""

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable
  JAVA_VERSION: "21"

jobs:
  checks:
    name: Analyze, Test, Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Prepare local env asset
        env:
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: |
          {
            echo "SUPABASE_URL="
            echo "SUPABASE_ANON_KEY="
            echo "YANDEX_MAPKIT_API_KEY=${YANDEX_MAPKIT_API_KEY}"
          } > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web

      - name: Build web with chats enabled
        run: flutter build web --dart-define=FEATURE_CHAT=true

  android-release:
    name: Android Release APK
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # Раньше пустой секрет молча собирал релизный APK на заглушках — с
      # дев-входом и моковыми людьми на карте вместо боевых данных, и никто
      # не узнавал об этом до ручной проверки на телефоне. Теперь пустое
      # значение останавливает сборку здесь, а не после 8 минут Gradle.
      - name: Verify required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_ANON_KEY" ] && missing="$missing SUPABASE_ANON_KEY"
          [ -z "$YANDEX_MAPKIT_API_KEY" ] && missing="$missing YANDEX_MAPKIT_API_KEY"
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$ANDROID_KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Релизная сборка без боевых секретов не имеет смысла — пусто:$missing"
            exit 1
          fi

      - name: Prepare local env asset
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "YANDEX_MAPKIT_API_KEY=${YANDEX_MAPKIT_API_KEY}"
          } > .env

      # Один и тот же ключ на каждой сборке — иначе Android считает
      # обновление другим приложением и требует сначала удалить старую
      # версию. Ключ и пароль живут только в секретах репозитория.
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/social-world-release.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=../social-world-release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      # versionCode = 5000 + номер запуска: растёт с каждой сборкой, поэтому
      # Android всегда видит новую версию и ставит поверх старой. База 5000 и
      # отказ от --split-per-abi — не случайность. Split-сборка добавляет к
      # коду префикс архитектуры (arm64 = 2000+N), а манифест автообновления
      # публикует код универсального APK. Раньше на телефоне стояло 2069, в
      # манифесте лежало 70: 70 <= 2069, лампочка обновления не загоралась, а
      # принудительная установка упала бы как понижение версии. Теперь тестовая
      # сборка и универсальная для обновлений — одна монотонная шкала.
      # Тестируем только на arm64 (телефон тестировщика): один файл вместо трёх.
      - name: Build release APK (arm64)
        env:
          # Оставляет в APK только arm64-библиотеки — см. build.gradle.kts.
          ARM64_ONLY: "1"
        run: flutter build apk --release --target-platform android-arm64 --build-number=$((5000 + ${{ github.run_number }}))

      - name: Upload APK artifact (arm64)
        uses: actions/upload-artifact@v5
        with:
          name: social-world-release-apk-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release tag
        id: release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: bash
        run: |
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            tag="android-release-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish APK release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # В выражениях Actions нет арифметики — версию считаем здесь.
          version_code=$((5000 + GITHUB_RUN_NUMBER))
          gh release create "${{ steps.release.outputs.tag }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Social World Android release ${{ steps.release.outputs.tag }}" \
            --notes "Release APK (arm64), подписан постоянным ключом — ставится поверх предыдущей версии без удаления. versionCode ${version_code}. Собран из коммита ${{ github.sha }}." \
            --prerelease

      # Автообновление внутри приложения качает один APK по прямой ссылке,
      # поэтому здесь собирается универсальная сборка без --split-per-abi:
      # иначе клиенту пришлось бы самому определять ABI устройства.
      - name: Build universal APK for in-app updates
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: |
          # Универсальная сборка перезапишет app-release.apk — arm64 сохраняем заранее.
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/app-arm64.apk"
          flutter build apk --release --build-number=$((5000 + ${{ github.run_number }}))

      # APK и манифест кладём в публичный на чтение бакет self-hosted Supabase
      # (см. supabase/migrations/0007_app_updates.sql). GitHub Releases для этого
      # не годятся: репозиторий приватный, и приложению пришлось бы носить в себе
      # токен с доступом к исходникам.
      - name: Verify service-role secret
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY пуст — публикация манифеста обновления упадёт, лучше остановиться здесь"
            exit 1
          fi

      - name: Publish update manifest to Supabase Storage
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          # Тот же код, что и у универсального APK (см. комментарий у сборки):
          # манифест обязан обещать ровно ту версию, что лежит в файле.
          VERSION_CODE=$((5000 + GITHUB_RUN_NUMBER))
          apk_name="social-world-${VERSION_CODE}.apk"
          version_name=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)

          upload() {
            curl --fail --silent --show-error \
              -X POST "${SUPABASE_URL}/storage/v1/object/app-releases/$1" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: $2" \
              -H "Cache-Control: $3" \
              -H "x-upsert: true" \
              --data-binary @"$4" > /dev/null
          }

          upload "${apk_name}" "application/vnd.android.package-archive" \
            "max-age=31536000" "build/app/outputs/flutter-apk/app-release.apk"

          # Лёгкий файл только для arm64 (~70 МБ вместо ~175): на мобильной сети
          # он доходит заметно чаще. Клиент выбирает его сам по архитектуре.
          arm64_name="social-world-${VERSION_CODE}-arm64.apk"
          arm64_url="${SUPABASE_URL}/storage/v1/object/public/app-releases/${arm64_name}"
          upload "${arm64_name}" "application/vnd.android.package-archive" \
            "max-age=31536000" "$RUNNER_TEMP/app-arm64.apk"

          # Манифест перезаписывается каждым релизом, поэтому кешировать его
          # надолго нельзя — иначе телефон ещё сутки не увидит новую версию.
          cat > manifest.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${version_name}",
            "apkUrl": "${SUPABASE_URL}/storage/v1/object/public/app-releases/${apk_name}",
            "apkUrlArm64": "${arm64_url}",
            "notes": "Сборка ${{ steps.release.outputs.tag }}"
          }
          EOF

          upload "manifest.json" "application/json" "max-age=60" "manifest.json"
