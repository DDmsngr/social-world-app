name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Опубликовать release APK в GitHub Release"
        required: true
        type: boolean
        default: true
      release_tag:
        description: "Тег релиза; пусто = android-release-<номер запуска>"
        required: false
        type: string
        default: ""

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable
  JAVA_VERSION: "21"

jobs:
  checks:
    name: Analyze, Test, Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Prepare local env asset
        env:
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: |
          {
            echo "SUPABASE_URL="
            echo "SUPABASE_ANON_KEY="
            echo "YANDEX_MAPKIT_API_KEY=${YANDEX_MAPKIT_API_KEY}"
          } > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web

      - name: Build web with chats enabled
        run: flutter build web --dart-define=FEATURE_CHAT=true

  android-release:
    name: Android Release APK
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # В релизной сборке ключи боевые: без них APK поднимался на заглушках —
      # с дев-входом и моковыми людьми на карте вместо реальных данных.
      - name: Prepare local env asset
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "YANDEX_MAPKIT_API_KEY=${YANDEX_MAPKIT_API_KEY}"
          } > .env

      # Один и тот же ключ на каждой сборке — иначе Android считает
      # обновление другим приложением и требует сначала удалить старую
      # версию. Ключ и пароль живут только в секретах репозитория.
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/social-world-release.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=../social-world-release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      # versionCode = номер запуска workflow — растёт с каждой сборкой,
      # поэтому Android всегда видит новую версию и ставит поверх старой.
      - name: Build release APK
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v5
        with:
          name: social-world-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release tag
        id: release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: bash
        run: |
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            tag="android-release-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish APK release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            build/app/outputs/flutter-apk/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Social World Android release ${{ steps.release.outputs.tag }}" \
            --notes "Release APK (arm64/armeabi-v7a/x86_64), подписан постоянным ключом — ставится поверх предыдущей версии без удаления. versionCode ${{ github.run_number }}. Собран из коммита ${{ github.sha }}." \
            --prerelease

      # Автообновление внутри приложения качает один APK по прямой ссылке,
      # поэтому здесь собирается универсальная сборка без --split-per-abi:
      # иначе клиенту пришлось бы самому определять ABI устройства.
      - name: Build universal APK for in-app updates
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: flutter build apk --release --build-number=${{ github.run_number }}

      # APK и манифест кладём в публичный на чтение бакет self-hosted Supabase
      # (см. supabase/migrations/0007_app_updates.sql). GitHub Releases для этого
      # не годятся: репозиторий приватный, и приложению пришлось бы носить в себе
      # токен с доступом к исходникам.
      - name: Publish update manifest to Supabase Storage
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail

          apk_name="social-world-${VERSION_CODE}.apk"
          version_name=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)

          upload() {
            curl --fail --silent --show-error \
              -X POST "${SUPABASE_URL}/storage/v1/object/app-releases/$1" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: $2" \
              -H "Cache-Control: $3" \
              -H "x-upsert: true" \
              --data-binary @"$4" > /dev/null
          }

          upload "${apk_name}" "application/vnd.android.package-archive" \
            "max-age=31536000" "build/app/outputs/flutter-apk/app-release.apk"

          # Манифест перезаписывается каждым релизом, поэтому кешировать его
          # надолго нельзя — иначе телефон ещё сутки не увидит новую версию.
          cat > manifest.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${version_name}",
            "apkUrl": "${SUPABASE_URL}/storage/v1/object/public/app-releases/${apk_name}",
            "notes": "Сборка ${{ steps.release.outputs.tag }}"
          }
          EOF

          upload "manifest.json" "application/json" "max-age=60" "manifest.json"
