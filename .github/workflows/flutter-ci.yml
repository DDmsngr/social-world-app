name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Опубликовать debug APK в GitHub Release"
        required: true
        type: boolean
        default: true
      release_tag:
        description: "Тег релиза; пусто = android-debug-<номер запуска>"
        required: false
        type: string
        default: ""

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable
  JAVA_VERSION: "21"

jobs:
  checks:
    name: Analyze, Test, Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Prepare local env asset
        env:
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: |
          {
            echo "SUPABASE_URL="
            echo "SUPABASE_ANON_KEY="
            echo "YANDEX_MAPKIT_API_KEY=${YANDEX_MAPKIT_API_KEY}"
          } > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web

      - name: Build web with chats enabled
        run: flutter build web --dart-define=FEATURE_CHAT=true

  android-apk:
    name: Android Debug APK
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Prepare local env asset
        env:
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: |
          {
            echo "SUPABASE_URL="
            echo "SUPABASE_ANON_KEY="
            echo "YANDEX_MAPKIT_API_KEY=${YANDEX_MAPKIT_API_KEY}"
          } > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: social-world-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Resolve release tag
        id: release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: bash
        run: |
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            tag="android-debug-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish APK release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            build/app/outputs/flutter-apk/app-debug.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Social World Android debug ${{ steps.release.outputs.tag }}" \
            --notes "Debug APK собран GitHub Actions из коммита ${{ github.sha }}. Для живой карты нужен YANDEX_MAPKIT_API_KEY в .env; без ключа приложение работает на dev/mock-данных." \
            --prerelease
