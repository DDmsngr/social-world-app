name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Опубликовать release APK в GitHub Release"
        required: true
        type: boolean
        default: true
      release_tag:
        description: "Тег релиза; пусто = android-release-<номер запуска>"
        required: false
        type: string
        default: ""

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable
  JAVA_VERSION: "21"

jobs:
  checks:
    name: Analyze, Test, Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Prepare local env asset
        env:
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: |
          {
            echo "SUPABASE_URL="
            echo "SUPABASE_ANON_KEY="
            echo "YANDEX_MAPKIT_API_KEY=${YANDEX_MAPKIT_API_KEY}"
          } > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web

      - name: Build web with chats enabled
        run: flutter build web --dart-define=FEATURE_CHAT=true

  android-release:
    name: Android Release APK
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      # Полная история нужна, чтобы собрать описание релиза из коммитов
      # между предыдущей и этой сборкой.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # Раньше пустой секрет молча собирал релизный APK на заглушках — с
      # дев-входом и моковыми людьми на карте вместо боевых данных, и никто
      # не узнавал об этом до ручной проверки на телефоне. Теперь пустое
      # значение останавливает сборку здесь, а не после 8 минут Gradle.
      - name: Verify required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_ANON_KEY" ] && missing="$missing SUPABASE_ANON_KEY"
          [ -z "$YANDEX_MAPKIT_API_KEY" ] && missing="$missing YANDEX_MAPKIT_API_KEY"
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$ANDROID_KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Релизная сборка без боевых секретов не имеет смысла — пусто:$missing"
            exit 1
          fi

      - name: Prepare local env asset
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: |
          # Приложение ходит в API через российскую точку (Caddy на ВМ Яндекса
          # проксирует на Supabase Cloud): supabase.co с телефонов в РФ без VPN
          # не открывается. Секрет SUPABASE_URL остаётся адресом самого
          # Cloud — им пользуются шаги CI (публикация релиза и т. п.).
          {
            echo "SUPABASE_URL=https://api-socialworld.deepdrift.tech"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "YANDEX_MAPKIT_API_KEY=${YANDEX_MAPKIT_API_KEY}"
          } > .env

      # Один и тот же ключ на каждой сборке — иначе Android считает
      # обновление другим приложением и требует сначала удалить старую
      # версию. Ключ и пароль живут только в секретах репозитория.
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/social-world-release.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=../social-world-release.jks
          EOF

      # Конфиг Firebase для пушей. Без него сборка проходит (плагин в режиме
      # WARN), но пуши в APK не работают — поэтому громкое предупреждение.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 пуст — APK соберётся без push-уведомлений"
          else
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          fi

      - name: Install dependencies
        run: flutter pub get

      # Вторая (универсальная) сборка в том же демоне падала в R8 с
      # OutOfMemoryError при 2 ГБ кучи. Пользовательский gradle.properties
      # перекрывает проектный, поэтому ноутбук остаётся на 2 ГБ.
      - name: Raise Gradle heap for CI
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:ReservedCodeCacheSize=512m" >> ~/.gradle/gradle.properties

      # versionCode = 5000 + номер запуска: растёт с каждой сборкой, поэтому
      # Android всегда видит новую версию и ставит поверх старой. База 5000 и
      # отказ от --split-per-abi — не случайность. Split-сборка добавляет к
      # коду префикс архитектуры (arm64 = 2000+N), а манифест автообновления
      # публикует код универсального APK. Раньше на телефоне стояло 2069, в
      # манифесте лежало 70: 70 <= 2069, лампочка обновления не загоралась, а
      # принудительная установка упала бы как понижение версии. Теперь тестовая
      # сборка и универсальная для обновлений — одна монотонная шкала.
      # Тестируем только на arm64 (телефон тестировщика): один файл вместо трёх.
      - name: Build release APK (arm64)
        env:
          # Оставляет в APK только arm64-библиотеки — см. build.gradle.kts.
          ARM64_ONLY: "1"
        run: flutter build apk --release --target-platform android-arm64 --build-number=$((5000 + ${{ github.run_number }})) --dart-define=FEATURE_CHAT=true

      - name: Upload APK artifact (arm64)
        uses: actions/upload-artifact@v5
        with:
          name: social-world-release-apk-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release tag
        id: release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}"
          if [ -z "$tag" ]; then
            tag="android-release-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish APK release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # В выражениях Actions нет арифметики — версию считаем здесь.
          version_code=$((5000 + GITHUB_RUN_NUMBER))
          gh release create "${{ steps.release.outputs.tag }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Social World Android release ${{ steps.release.outputs.tag }}" \
            --notes "Release APK (arm64), подписан постоянным ключом — ставится поверх предыдущей версии без удаления. versionCode ${version_code}. Собран из коммита ${{ github.sha }}." \
            --prerelease

      # Автообновление внутри приложения качает один APK по прямой ссылке,
      # поэтому здесь собирается универсальная сборка без --split-per-abi:
      # иначе клиенту пришлось бы самому определять ABI устройства.
      - name: Build universal APK for in-app updates
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        run: |
          # Универсальная сборка перезапишет app-release.apk — arm64 сохраняем заранее.
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/app-arm64.apk"
          flutter build apk --release --build-number=$((5000 + ${{ github.run_number }})) --dart-define=FEATURE_CHAT=true

      # Манифест и сам APK кладём не в Supabase Storage, а в публичное
      # репо-зеркало DDmsngr/social-world-releases (только файлы релиза, без
      # исходников) — тот же приём, что и в KOTT. Причины две: репозиторий
      # приложения приватный (анонимно ни raw.githubusercontent.com, ни
      # Release-ассет не отдать), а на self-hosted лимит файла Storage поднят
      # до 250 МБ, но на текущем временном бэкенде (Supabase Cloud, free tier)
      # он жёстко зашит в 50 МБ — наш APK (даже arm64) туда не помещается.
      # Нужен секрет SOCIAL_WORLD_RELEASES_TOKEN — PAT с правом записи в
      # DDmsngr/social-world-releases (обычный GITHUB_TOKEN на кросс-репо
      # запись не годится). Нет секрета — публикация тихо пропускается,
      # остальная сборка не страдает.
      - name: Publish release and manifest to social-world-releases
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_WORLD_RELEASES_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::SOCIAL_WORLD_RELEASES_TOKEN не задан — публикация в social-world-releases пропущена, автообновление в приложении не сработает для этого релиза."
            exit 0
          fi

          VERSION_CODE=$((5000 + GITHUB_RUN_NUMBER))
          version_name=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)
          TAG="android-release-${GITHUB_RUN_NUMBER}"

          # Черновик описания — заголовки коммитов с предыдущей сборки. Её
          # коммит берём из каталога релизов в дашборде; если каталога ещё
          # нет или коммит пропал из истории, показываем последние 15.
          prev_sha=$(curl --silent \
            "${SUPABASE_URL}/rest/v1/ws_app_releases?select=commit_sha&order=version_code.desc&limit=1" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" | jq -r '.[0].commit_sha // empty' 2>/dev/null || true)
          if [ -n "${prev_sha}" ] && git cat-file -e "${prev_sha}^{commit}" 2>/dev/null; then
            notes=$(git log --no-merges -n 30 --pretty=format:'- %s' "${prev_sha}..${GITHUB_SHA}")
          else
            notes=$(git log --no-merges --pretty=format:'- %s' -n 15 "${GITHUB_SHA}")
          fi
          [ -n "${notes}" ] || notes="Сборка ${TAG}"

          apk_name="social-world-${VERSION_CODE}.apk"
          arm64_name="social-world-${VERSION_CODE}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "${apk_name}"
          cp "$RUNNER_TEMP/app-arm64.apk" "${arm64_name}"
          # Постоянное имя для ссылок-приглашений: .../releases/latest/download/chawo.apk
          # сразу скачивает файл последней сборки, без страницы GitHub.
          cp "$RUNNER_TEMP/app-arm64.apk" chawo.apk

          gh release create "$TAG" "${apk_name}" "${arm64_name}" chawo.apk \
            --repo DDmsngr/social-world-releases \
            --title "Social World Android release ${TAG}" \
            --notes "${notes}" \
            --latest

          apk_url="https://github.com/DDmsngr/social-world-releases/releases/download/${TAG}/${apk_name}"
          arm64_url="https://github.com/DDmsngr/social-world-releases/releases/download/${TAG}/${arm64_name}"

          rm -rf /tmp/sw-releases
          git clone "https://x-access-token:${GH_TOKEN}@github.com/DDmsngr/social-world-releases.git" /tmp/sw-releases
          jq -n --argjson code "${VERSION_CODE}" --arg name "${version_name}" \
            --arg url "${apk_url}" --arg arm64 "${arm64_url}" --arg notes "${notes}" \
            '{versionCode: $code, versionName: $name, apkUrl: $url, apkUrlArm64: $arm64, notes: $notes}' \
            > /tmp/sw-releases/manifest.json
          cd /tmp/sw-releases
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "chore: манифест ${version_name}+${VERSION_CODE}"
          git push
          cd "${GITHUB_WORKSPACE}"

          # Каталог для дашборда: описание можно потом поправить руками, повторный
          # запуск той же сборки правленый текст не затирает (см. 0022). Люди
          # качают APK с телефона, поэтому ссылка на лёгкий arm64-файл.
          arm64_size=$(stat -c %s "${arm64_name}")
          jq -n --argjson code "${VERSION_CODE}" --arg name "${version_name}" \
            --arg url "${arm64_url}" --argjson size "${arm64_size}" \
            --arg sha "${GITHUB_SHA}" --arg notes "${notes}" \
            '{p_version_code: $code, p_version_name: $name, p_apk_url: $url, p_size: $size, p_commit: $sha, p_notes: $notes}' |
          curl --fail --silent --show-error \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/ws_publish_release" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @- > /dev/null
